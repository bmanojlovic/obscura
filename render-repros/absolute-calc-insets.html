<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>absolute calc insets</title>
  <style>
    html, body { margin: 0; background: #fff; }
    #cb {
      position: relative; width: 200px; height: 100px;
      margin: 20px 0 0 30px; padding: 10px 20px;
      border: 5px solid #ccc;
    }
    #static { width: 50px; height: 30px; margin: 7px; padding: 3px; }
    .box { position: absolute; width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div id="cb"><div id="static">
    <div id="start" class="box"
         style="left:calc(100% + 4px); top:calc(100% + 4px); background:#087f5b"></div>
    <div id="half" class="box"
         style="left:50%; top:50%; background:#1971c2"></div>
    <div id="end" class="box"
         style="right:calc(100% - 4px); bottom:calc(100% - 4px); background:#e8590c"></div>
  </div></div>
  <script>
    window.__boxes = {};
    for (const id of ['start', 'half', 'end']) {
      const r = document.getElementById(id).getBoundingClientRect();
      window.__boxes[id] = [r.x, r.y, r.width, r.height];
    }
  </script>
</body>
</html>
